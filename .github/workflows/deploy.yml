name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # Strips devDependencies (typescript, @types/*, etc.) out of
      # node_modules in place, leaving exactly what dist/ needs at runtime.
      # Done here (full CPU/RAM on the runner) instead of on the droplet —
      # see the SSH step below for why.
      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/dist
          cp -r node_modules deploy/node_modules
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json

      - name: Copy build to DigitalOcean
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "deploy/*"
          target: "/var/www/auth-service-SaaS"
          strip_components: 1

      # The droplet is a 1 vCPU/1GB box — running `npm ci` there used to
      # regularly hang past this step's timeout and get killed mid-install,
      # leaving a corrupted node_modules the app would then crash-loop on.
      # node_modules is now built on the runner and shipped via scp above,
      # so this step only ever restarts PM2 — nothing here can leave the
      # droplet in a half-installed state again.
      - name: Restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          script: |
            cd /var/www/auth-service-SaaS

            pm2 restart auth-service --update-env

            pm2 status
